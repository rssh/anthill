[package]
name = "anthill-core"
version = "0.1.0"
edition = "2021"
description = "Anthill kernel language: terms, parser, KB, stage0"

[dependencies]
smallvec = { version = "1", features = ["const_generics"] }
ordered-float = "4"
num-bigint = "0.4"
indexmap = "2"
tree-sitter = "0.25"
tree-sitter-anthill = { path = "../../tree-sitter-anthill" }
serde = "1"
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
imbl = "7.0.0"

[dev-dependencies]
tempfile = "=3.14.0"
# WI-5XBBQ — the guardians example's checker is anthill code that calls
# `anthill.reflect.qualified_name`, which `anthill-stl`'s `register_reflect_builtins`
# binds (WI-SPGBP wired it into `runner::register_runtime`). Without it the example's
# own test would run against a SMALLER reflect surface than production does, and the
# gate would die `OperationBodyMissing` on a name the CLI answers. A dev-dependency
# cycle (stl depends on core's lib; core's TESTS depend on stl) is what Cargo supports
# for exactly this.
anthill-stl = { path = "../anthill-stl" }
