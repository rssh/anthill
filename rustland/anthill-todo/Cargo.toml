[package]
name = "anthill-todo"
version = "0.1.1"
edition = "2021"
description = "Anthill TODO: structured work management CLI"

[[bin]]
name = "anthill-todo"
path = "src/main.rs"

[dependencies]
anthill-core = { path = "../anthill-core" }
anthill-stl = { path = "../anthill-stl" }
anthill-version = { path = "../anthill-version" }
# The SAME chrono features as anthill-core, on purpose. `test.sh` runs the gate as two
# cargo invocations, and a different set here made the second one resolve a different
# `chrono` — and with it build anthill-core again (WI-20261006-ZVV24: four library
# builds a gate, each ~110 s once the crate is optimized).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
smallvec = "1"

[dev-dependencies]
tempfile = "3"
