[package]
name = "anthill-smt-gen"
version = "0.1.0"
edition = "2021"
description = "Emit SMT-LIB 2.6 from anthill specifications (KB-driven, Z3 / CVC5 target)."
autotests = false

[dependencies]
anthill-core = { path = "../anthill-core" }
sha2 = "0.10"
hex = "0.4"
# The derive macros come from `serde_derive` DIRECTLY, not through `serde`'s `derive`
# feature. Features unify across whatever one cargo invocation builds, so with the
# feature on here, anthill-core's own `serde` gained a dependency on `serde_derive` —
# and through it on `syn`, whose features differ by which crates are selected (clap's
# derive asks for more). anthill-core was then a different build per selection, rebuilt
# whenever the selection changed (WI-20261006-ZVV24; ~110 s a time once optimized).
serde = "1"
serde_derive = "1"
serde_json = "1"
dirs = "5"
smallvec = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "cache_key"
path = "tests/cache_key_test.rs"

[[test]]
name = "state_hash"
path = "tests/state_hash_test.rs"

[[test]]
name = "blob"
path = "tests/blob_test.rs"

[[test]]
name = "policy"
path = "tests/policy_test.rs"
