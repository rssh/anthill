# No options set. This file exists for the comment.
#
# WHY `cargo fmt` ONCE OOM-KILLED THE WHOLE 15.7 GB WSL VM, and why nothing here needs to
# guard against it any more. The cause is NOT file size and NOT formatting — it is
# `--check`'s diff emitter. MEASURED 2026-08-30 (WI-20260830-009H2):
#
#   memory allocation of 20121126480 bytes failed
#     10: diff::lines
#     11: rustfmt_nightly::rustfmt_diff::make_diff
#     12: <DiffEmitter as Emitter>::emit_formatted_file
#
# `--check` runs an LCS diff of input against formatted output, and the `diff` crate builds
# a dense O(n x m) table. `kb/typing.rs` was 72451 lines in / 72564 out with ~641 differing
# lines SCATTERED throughout, so the common prefix/suffix trim removed almost nothing:
# ~70924^2 x 4 bytes = 20,121,126,480 — the panic's number, to the byte.
#
# The same file, same rustfmt, three emitters:
#
#   rustfmt --emit stdout   87 MB   0.60s     <- fine
#   rustfmt --emit files    87 MB   0.60s     <- fine; this is what plain `cargo fmt` uses
#   rustfmt --check         20 GB alloc       <- OOM
#
# So plain `cargo fmt` was never broken. Only `cargo fmt -- --check` was, and only because
# the file was UNFORMATTED. Formatted, `--check` on that same file costs 92 MB / 0.45s.
#
# That is the trap this file used to set: an `ignore = ["src/kb/typing.rs"]` entry kept the
# file hand-formatted, and being hand-formatted is exactly what made `--check` explode. The
# ignore was load-bearing for the bomb, not against it. It is gone.
#
# WHAT IS AND IS NOT FORMATTED, stated so silence is not read as cleanliness. All of
# `anthill-core/src/` is rustfmt-clean as of 2026-08-30. `anthill-core/tests/` is NOT: 118
# files still differ (115 under `tests/include/`, plus `wi_tests.rs`, `guardians_test.rs` and
# `common/mod.rs`), so
#
#   cargo fmt -p anthill-core -- --check
#
# runs to completion in 266 MB / 2.7s and exits 1, listing those files. It is safe to run
# and it is NOT yet a CI gate. Making it one means formatting `anthill-core/tests/` too — that
# was measured at 139 files and a net -3745 lines, and was deliberately NOT done here to
# keep this change off every in-flight test branch.
#
# WHAT TO DO IF THE OOM COMES BACK: it can only come back by letting a very large file drift
# far out of format again. `cargo fmt` (no `--check`) is always safe and always cheap — run
# it, and `--check` is cheap again. Do NOT re-add an ignore; that re-arms it.
#
# NOTE the same mechanism bites below the OOM line elsewhere: `load.rs` (~30k lines) reached
# 2.6 GB on `--check` while unformatted, which is why `src/` was formatted as a whole rather
# than `typing.rs` alone — that narrower fix left `--check` at 2.7 GB.
